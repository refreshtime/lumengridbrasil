<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post 03 — Confiança</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:44px;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<!-- POST 03 · GRID · Pesado · Template A -->
<!-- Layout: Números dominam. Grid de stats + lista de diferenciais. -->
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#0e0e14;">

  <!-- BG: foto sutil de instalador no telhado -->
  <div style="position:absolute;inset:0;z-index:0;background:url('../imagens/INSTALADOR NO TELHADO.jpeg') center 30%/cover no-repeat;opacity:.08;"></div>

  <!-- BG: gradiente laranja direcional esquerda -->
  <div style="position:absolute;inset:0;z-index:1;background:
    radial-gradient(ellipse at 0% 55%, rgba(242,101,34,.14) 0%, transparent 45%),
    linear-gradient(to right, rgba(242,101,34,.05) 0%, transparent 60%),
    #0e0e14;"></div>

  <!-- Linha decorativa vertical — separa a composição -->
  <div style="position:absolute;top:250px;bottom:160px;left:88px;width:3px;z-index:5;background:linear-gradient(to bottom,transparent 0%,#F26522 15%,#F26522 85%,transparent 100%);opacity:.55;"></div>

  <!-- Logo -->
  <div style="position:absolute;top:72px;left:88px;display:flex;align-items:center;gap:12px;z-index:20;">
    <img src="../imagens/logo-icone.png" alt="" class="li">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:baseline;line-height:1;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;">GRID</span>
      </div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);">Energia Inteligente</span>
    </div>
  </div>

  <!-- Eyebrow -->
  <div style="position:absolute;top:163px;left:120px;z-index:20;">
    <p style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(242,101,34,.95);margin:0;">▶ confiança</p>
  </div>

  <!-- Conteúdo principal — deslocado para a direita da linha -->
  <div style="position:absolute;left:136px;right:88px;top:240px;z-index:20;">

    <p style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:400;color:rgba(250,250,250,.38);letter-spacing:.02em;margin:0 0 64px;">Confiança se constrói<br>com resultados.</p>

    <!-- STAT 1: +8 anos -->
    <div style="margin-bottom:48px;">
      <p style="font-family:'Space Grotesk',sans-serif;font-size:130px;font-weight:800;color:#F26522;line-height:.9;letter-spacing:-4px;margin:0;">+8</p>
      <p style="font-family:'DM Sans',sans-serif;font-size:22px;font-weight:400;color:rgba(250,250,250,.55);letter-spacing:.06em;margin:10px 0 0;">anos de experiência</p>
    </div>

    <!-- Linha divisória horizontal -->
    <div style="width:100%;height:1px;background:linear-gradient(to right,rgba(242,101,34,.35),transparent);margin-bottom:48px;"></div>

    <!-- STAT 2: +700 projetos -->
    <div style="margin-bottom:72px;">
      <p style="font-family:'Space Grotesk',sans-serif;font-size:130px;font-weight:800;color:#FAFAFA;line-height:.9;letter-spacing:-4px;margin:0;">+700</p>
      <p style="font-family:'DM Sans',sans-serif;font-size:22px;font-weight:400;color:rgba(250,250,250,.55);letter-spacing:.06em;margin:10px 0 0;">projetos homologados</p>
    </div>

    <!-- Linha divisória horizontal -->
    <div style="width:100%;height:1px;background:linear-gradient(to right,rgba(242,101,34,.20),transparent);margin-bottom:44px;"></div>

    <!-- Diferenciais: lista compacta -->
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;align-items:center;gap:16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F26522" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        <p style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:400;color:rgba(250,250,250,.60);margin:0;">Atendimento consultivo</p>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F26522" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        <p style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:400;color:rgba(250,250,250,.60);margin:0;">Projetos personalizados</p>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F26522" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        <p style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:400;color:rgba(250,250,250,.60);margin:0;">Equipe especializada</p>
      </div>
    </div>

  </div>

</div>
</body>
</html>
