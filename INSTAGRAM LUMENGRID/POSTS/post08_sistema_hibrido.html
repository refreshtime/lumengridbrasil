<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post 08-B — Sistema Híbrido</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:44px;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<!-- PLACEHOLDER: substituir bg por foto de casa com metade iluminada e metade escura durante apagão -->
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#060609;">

  <!-- BG: split escuro/quente (metade sem energia, metade com) -->
  <div style="position:absolute;inset:0;z-index:0;background:linear-gradient(108deg,#060609 0%,#060609 44%,rgba(22,11,3,1) 58%,rgba(28,13,3,1) 100%);"></div>
  <!-- Glow quente no lado direito (casa com energia) -->
  <div style="position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 82% 55%,rgba(242,101,34,.15) 0%,rgba(242,101,34,0) 50%);"></div>
  <!-- Linha divisória vertical sutil -->
  <div style="position:absolute;top:0;bottom:0;left:46%;width:1px;z-index:2;background:linear-gradient(to bottom,transparent 5%,rgba(242,101,34,.30) 30%,rgba(242,101,34,.22) 70%,transparent 95%);"></div>

  <!-- Moldura laranja — Template B -->
  <div style="position:absolute;inset:24px;z-index:25;border:4px solid rgba(242,101,34,.65);pointer-events:none;"></div>

  <!-- Logo -->
  <div style="position:absolute;top:72px;left:88px;display:flex;align-items:center;gap:12px;z-index:20;">
    <img src="../imagens/logo-icone.png" alt="" class="li">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:baseline;line-height:1;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;">GRID</span>
      </div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);">Energia Inteligente</span>
    </div>
  </div>

  <!-- Eyebrow -->
  <div style="position:absolute;top:163px;left:88px;z-index:20;">
    <p style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(242,101,34,.95);margin:0;">▶ sistema híbrido</p>
  </div>

  <!-- Conteúdo -->
  <div style="position:absolute;left:88px;right:88px;bottom:110px;z-index:20;">
    <p style="font-family:'Space Grotesk',sans-serif;font-size:68px;font-weight:700;color:rgba(250,250,250,.42);line-height:1.05;letter-spacing:-1.5px;margin:0 0 4px;">Quando a rua<br>fica sem energia...</p>
    <p style="font-family:'Space Grotesk',sans-serif;font-size:68px;font-weight:700;color:#FAFAFA;line-height:1.05;letter-spacing:-1.5px;margin:0 0 28px;">sua casa não<br>precisa <span style="color:#F26522;">ficar.</span></p>
    <p style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:300;color:rgba(250,250,250,.48);line-height:1.6;max-width:680px;margin:0;">Baterias de lítio armazenam a energia quando o sol aparece e a entregam quando a concessionária falha.</p>
  </div>

</div>
</body>
</html>
