<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post 12-B — Casa Inteligente</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:44px;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<!-- PLACEHOLDER: substituir bg por foto de casa de alto padrão -->
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#0c0c10;">

  <!-- BG: glow premium -->
  <div style="position:absolute;inset:0;z-index:0;background:
    radial-gradient(ellipse at 25% 65%, rgba(242,101,34,.09) 0%, transparent 50%),
    radial-gradient(ellipse at 82% 22%, rgba(242,101,34,.06) 0%, transparent 42%),
    #0c0c10;"></div>

  <!-- Linhas geométricas decorativas (janelas de casa premium em CSS) -->
  <div style="position:absolute;top:30%;left:12%;z-index:2;width:140px;height:90px;border:1px solid rgba(242,101,34,.08);border-radius:2px;"></div>
  <div style="position:absolute;top:30%;left:12%;z-index:2;width:66px;height:90px;border-right:1px solid rgba(242,101,34,.06);"></div>
  <div style="position:absolute;top:30%;left:12%;z-index:2;height:44px;width:140px;border-bottom:1px solid rgba(242,101,34,.06);"></div>

  <div style="position:absolute;top:28%;right:10%;z-index:2;width:180px;height:110px;border:1px solid rgba(242,101,34,.07);border-radius:2px;"></div>
  <div style="position:absolute;top:28%;right:10%;z-index:2;width:88px;height:110px;border-right:1px solid rgba(242,101,34,.05);"></div>
  <div style="position:absolute;top:28%;right:10%;z-index:2;height:55px;width:180px;border-bottom:1px solid rgba(242,101,34,.05);"></div>

  <!-- Moldura laranja — Template B -->
  <div style="position:absolute;inset:24px;z-index:25;border:4px solid rgba(242,101,34,.65);pointer-events:none;"></div>

  <!-- Logo -->
  <div style="position:absolute;top:72px;left:88px;display:flex;align-items:center;gap:12px;z-index:20;">
    <img src="../imagens/logo-icone.png" alt="" class="li">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:baseline;line-height:1;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;">GRID</span>
      </div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);">Energia Inteligente</span>
    </div>
  </div>

  <!-- Eyebrow -->
  <div style="position:absolute;top:163px;left:88px;z-index:20;">
    <p style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(242,101,34,.95);margin:0;">▶ casa inteligente</p>
  </div>

  <!-- Conteúdo central -->
  <div style="position:absolute;left:88px;right:88px;top:50%;transform:translateY(-54%);z-index:20;">
    <p style="font-family:'Space Grotesk',sans-serif;font-size:62px;font-weight:700;color:rgba(250,250,250,.72);line-height:1.1;letter-spacing:-1.2px;margin:0 0 6px;">Casas inteligentes<br>não economizam<br>energia.</p>
    <div style="width:52px;height:3px;background:#F26522;border-radius:2px;margin:28px 0;"></div>
    <p style="font-family:'Space Grotesk',sans-serif;font-size:62px;font-weight:700;color:#F26522;line-height:1.1;letter-spacing:-1.2px;margin:0 0 40px;">Elas administram<br>energia.</p>
    <p style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:300;color:rgba(250,250,250,.45);line-height:1.65;max-width:780px;margin:0;">Produzir, armazenar, distribuir e monitorar — tudo integrado, tudo sob controle. Esse é o futuro. E ele está disponível agora.</p>
  </div>

</div>
</body>
</html>
