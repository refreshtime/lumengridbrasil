<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post 06-B — Apagão</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:0;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#060609;">

  <!-- BG: bairro no apagão com uma única casa iluminada -->
  <div style="position:absolute;inset:0;z-index:0;background:#060609 url('../../imagens/PROJETOS/post-apagao.png') center/cover no-repeat;"></div>

  <!-- Etiqueta — topo, visível no feed -->
  <div style="position:absolute;top:165px;left:0;right:0;z-index:20;text-align:center;">
    <p style="font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:5px;text-transform:uppercase;color:rgba(242,101,34,.80);text-shadow:0 2px 8px rgba(0,0,0,.95);margin:0;">▶ quando a luz acaba</p>
  </div>

  <!-- Logo — cabeçalho, alinhada ao topo como nos outros posts -->
  <div style="position:absolute;top:60px;left:88px;display:flex;align-items:center;gap:12px;z-index:20;">
    <img src="../../imagens/LOGOS/logo-icone.png" alt="" class="li">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:baseline;line-height:1;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;text-shadow:0 2px 10px rgba(0,0,0,.95);">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;text-shadow:0 2px 10px rgba(0,0,0,.95);">GRID</span>
      </div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);text-shadow:0 2px 8px rgba(0,0,0,.95);">Energia Inteligente</span>
    </div>
  </div>

  <!-- Conteúdo centralizado verticalmente — dentro do crop do feed (top 1080px) -->
  <div style="position:absolute;left:88px;right:88px;top:50%;transform:translateY(-44%);z-index:20;text-align:center;">
    <p style="font-family:'DM Sans',sans-serif;font-size:28px;font-weight:500;color:rgba(250,250,250,.95);line-height:1.60;text-shadow:0 2px 24px rgba(0,0,0,.99),0 0 48px rgba(0,0,0,.90);margin:0 0 36px;">A única casa iluminada<br>do bairro não foi por sorte.</p>
    <div style="width:44px;height:2px;background:#F26522;border-radius:2px;margin:0 auto 36px;opacity:.90;"></div>
    <p style="font-family:'Space Grotesk',sans-serif;font-size:76px;font-weight:700;color:#FAFAFA;line-height:1.05;letter-spacing:-1.5px;text-shadow:0 4px 28px rgba(0,0,0,.99),0 0 60px rgba(0,0,0,.80);margin:0;">Você só percebe<br>o valor da energia<br>quando ela <span style="color:#F26522;">acaba.</span></p>
  </div>

</div>

</html>
