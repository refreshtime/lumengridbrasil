<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post Posto — Backup Bateria de Lítio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:0;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#0a0a0a;">

  <!-- BG: foto aérea noturna do posto com painéis solares -->
  <div style="position:absolute;inset:0;z-index:0;background:url('../../imagens/PROJETOS/posto-solar-noturno.png') center 45%/cover no-repeat;"></div>

  <!-- Overlay suave — foto já é escura, só reforça leitura do texto -->
  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom, rgba(0,0,0,.18) 0%, rgba(0,0,0,.10) 30%, rgba(0,0,0,.45) 60%, rgba(0,0,0,.82) 100%);"></div>

  <!-- Header: logo + eyebrow -->
  <div style="position:absolute;top:72px;left:88px;right:88px;display:flex;align-items:center;justify-content:space-between;z-index:20;">
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="../../imagens/LOGOS/logo-icone.png" alt="" class="li">
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div style="display:flex;align-items:baseline;line-height:1;">
          <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.99);">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.99);">GRID</span>
        </div>
        <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);text-shadow:0 2px 8px rgba(0,0,0,.99);">Energia Inteligente</span>
      </div>
    </div>
    <p style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:rgba(242,101,34,.85);text-shadow:0 2px 8px rgba(0,0,0,.99);margin:0;">▶ backup com bateria de lítio</p>
  </div>

  <!-- Conteúdo principal — base do post -->
  <div style="position:absolute;left:88px;right:88px;bottom:110px;z-index:20;text-align:center;">
    <p style="font-family:'Space Grotesk',sans-serif;font-size:74px;font-weight:700;color:#FAFAFA;line-height:1.05;letter-spacing:-1.4px;text-shadow:0 4px 28px rgba(0,0,0,.95),0 0 60px rgba(0,0,0,.70);margin:0 0 36px;">Seu posto<br>não pode<br><span style="color:#F26522;">parar.</span></p>
    <div style="width:44px;height:2px;background:#F26522;border-radius:2px;margin:0 auto 32px;opacity:.85;"></div>
    <p style="font-family:'DM Sans',sans-serif;font-size:32px;font-weight:400;color:rgba(250,250,250,.90);line-height:1.60;text-shadow:0 2px 24px rgba(0,0,0,.99);margin:0;">Conheça o backup inteligente com baterias de lítio:<br>energia sem ruído, sem combustível<br>e sem as limitações de um gerador.<br><br><span style="color:rgba(250,250,250,.75);font-size:30px;">Mais segurança para manter a operação<br>durante apagões.</span></p>
  </div>

</div>
</body>
</html>
