<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post 08-B — Sistema Híbrido</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:0;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#060609;">

  <!-- BG: rua no escuro e residência protegida pelo sistema híbrido -->
  <div style="position:absolute;inset:0;z-index:0;background:#060609 url('../../imagens/PROJETOS/casa-sistema-hibrido.png') center/cover no-repeat;"></div>
  <!-- Header: logo + eyebrow mesma linha -->
  <div style="position:absolute;top:72px;left:88px;right:88px;display:flex;align-items:center;justify-content:space-between;z-index:20;">
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="../../imagens/LOGOS/logo-icone.png" alt="" class="li">
      <div style="display:flex;flex-direction:column;gap:2px;">
        <div style="display:flex;align-items:baseline;line-height:1;">
          <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.99);">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;text-shadow:0 2px 12px rgba(0,0,0,.99);">GRID</span>
        </div>
        <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);text-shadow:0 2px 8px rgba(0,0,0,.99);">Energia Inteligente</span>
      </div>
    </div>
    <p style="font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:rgba(242,101,34,.85);text-shadow:0 2px 8px rgba(0,0,0,.99);margin:0;">▶ sistema híbrido</p>
  </div>

  <!-- Conteúdo — esquerda, onde a foto está escura -->
  <div style="position:absolute;left:88px;right:500px;top:50%;transform:translateY(-50%);z-index:20;">
    <p style="font-family:'Space Grotesk',sans-serif;font-size:62px;font-weight:700;color:rgba(250,250,250,.65);line-height:1.05;letter-spacing:-1.5px;text-shadow:0 4px 28px rgba(0,0,0,.95);margin:0 0 6px;">Quando a rua<br>fica sem energia...</p>
    <p style="font-family:'Space Grotesk',sans-serif;font-size:62px;font-weight:700;color:#FAFAFA;line-height:1.05;letter-spacing:-1.5px;text-shadow:0 4px 28px rgba(0,0,0,.95);margin:0 0 32px;">sua casa não<br>precisa <span style="color:#F26522;">ficar.</span></p>
    <div style="width:40px;height:2px;background:#F26522;border-radius:2px;margin:0 0 28px;opacity:.85;"></div>
    <p style="font-family:'DM Sans',sans-serif;font-size:21px;font-weight:400;color:rgba(250,250,250,.88);line-height:1.65;text-shadow:0 2px 24px rgba(0,0,0,.99);margin:0;">Baterias de lítio armazenam<br>a energia quando o sol aparece<br>— e entregam quando a<br>concessionária falha.</p>
  </div>

</div>
</body>
</html>
