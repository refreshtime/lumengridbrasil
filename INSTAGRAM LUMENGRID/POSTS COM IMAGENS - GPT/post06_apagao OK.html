<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post 06-B — Apagão</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:44px;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#060609;">

  <!-- BG: bairro no apagão com uma única casa iluminada -->
  <div style="position:absolute;inset:0;z-index:0;background:#060609 url('assets/images/post06-bairro-apagao-alto-padrao.png') center/cover no-repeat;"></div>
  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(3,4,8,.12) 0%,rgba(3,4,8,0) 46%,rgba(3,4,8,.90) 100%);"></div>

  <!-- Moldura laranja — Template B -->
  <div style="position:absolute;inset:24px;z-index:25;border:4px solid rgba(242,101,34,.65);pointer-events:none;"></div>

  <!-- Logo -->
  <div style="position:absolute;top:72px;left:88px;display:flex;align-items:center;gap:12px;z-index:20;">
    <img src="../imagens/logo-icone.png" alt="" class="li">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:baseline;line-height:1;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;">GRID</span>
      </div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);">Energia Inteligente</span>
    </div>
  </div>

  <!-- Eyebrow -->
  <div style="position:absolute;top:163px;left:88px;z-index:20;">
    <p style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(242,101,34,.95);margin:0;">▶ quando a luz acaba</p>
  </div>

  <!-- Conteúdo -->
  <div style="position:absolute;left:88px;right:88px;bottom:110px;z-index:20;">
    <p style="font-family:'Space Grotesk',sans-serif;font-size:68px;font-weight:700;color:#FAFAFA;line-height:1.05;letter-spacing:-1.5px;margin:0 0 28px;">Você só percebe<br>o valor da energia<br>quando ela <span style="color:#F26522;">acaba.</span></p>
    <p style="font-family:'DM Sans',sans-serif;font-size:22px;font-weight:300;color:rgba(250,250,250,.52);line-height:1.6;max-width:720px;margin:0;">A única casa iluminada do bairro não foi por sorte.</p>
  </div>

</div>

</html>
