<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LumenGrid — Post 10-B — Bateria Residencial</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:44px;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>
<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#161616;">

  <!-- BG: bateria residencial em ambiente técnico de alto padrão -->
  <div style="position:absolute;inset:0;z-index:0;background:url('assets/images/post12-bateria-residencial-premium.png') 64% center/cover no-repeat;"></div>
  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(to right,rgba(12,12,16,.96) 0%,rgba(12,12,16,.83) 47%,rgba(12,12,16,.35) 100%),linear-gradient(to bottom,rgba(12,12,16,.40) 0%,rgba(12,12,16,.10) 55%,rgba(12,12,16,.78) 100%);"></div>

  <!-- Moldura laranja — Template B -->
  <div style="position:absolute;inset:24px;z-index:25;border:4px solid rgba(242,101,34,.65);pointer-events:none;"></div>

  <!-- Logo -->
  <div style="position:absolute;top:72px;left:88px;display:flex;align-items:center;gap:12px;z-index:20;">
    <img src="../imagens/logo-icone.png" alt="" class="li">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:baseline;line-height:1;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;">GRID</span>
      </div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);">Energia Inteligente</span>
    </div>
  </div>

  <!-- Eyebrow -->
  <div style="position:absolute;top:163px;left:88px;z-index:20;">
    <p style="font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:rgba(242,101,34,.95);margin:0;">▶ bateria residencial</p>
  </div>

  <!-- Conteúdo central -->
  <div style="position:absolute;left:88px;right:88px;top:50%;transform:translateY(-50%);z-index:20;">
    <!-- Decoração: ícone grande de bateria em CSS -->
    <div style="margin-bottom:52px;">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="rgba(242,101,34,0.35)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="6" width="18" height="12" rx="2"/>
        <line x1="23" y1="11" x2="23" y2="13"/>
        <rect x="4" y="9" width="10" height="6" rx="1" fill="rgba(242,101,34,0.12)" stroke="rgba(242,101,34,0.50)" stroke-width="1.2"/>
      </svg>
    </div>
    <p style="font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:700;color:#FAFAFA;line-height:1.1;letter-spacing:-1px;margin:0 0 24px;">Energia não vale<br>apenas quando<br>ela é gerada.</p>
    <div style="width:52px;height:2px;background:#F26522;border-radius:2px;opacity:.65;margin:0 0 28px;"></div>
    <p style="font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;color:#F26522;line-height:1.2;letter-spacing:-.5px;margin:0 0 36px;">Vale quando ela<br>continua disponível.</p>
    <p style="font-family:'DM Sans',sans-serif;font-size:20px;font-weight:300;color:rgba(250,250,250,.48);line-height:1.65;max-width:780px;margin:0;">A bateria residencial garante que a energia que o sol produz durante o dia continue trabalhando para você à noite.</p>
  </div>

</div>
</body>
</html>
