<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LumenGrid — Microinversor vs String</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a10;display:flex;justify-content:center;padding:44px;}
.li{height:58px;width:auto;object-fit:contain;filter:drop-shadow(0 0 18px rgba(242,101,34,.80)) drop-shadow(0 0 7px rgba(242,101,34,.55)) drop-shadow(0 2px 10px rgba(0,0,0,.9));}
</style>
</head>
<body>

<div style="width:1080px;height:1350px;position:relative;overflow:hidden;background:#0b0b12;">

  <!-- BG glow sutil -->
  <div style="position:absolute;inset:0;z-index:0;background:
    radial-gradient(ellipse at 50% 0%,   rgba(242,101,34,.07) 0%, transparent 45%),
    radial-gradient(ellipse at 0%  100%, rgba(242,101,34,.04) 0%, transparent 40%),
    #0b0b12;"></div>

  <!-- Moldura laranja -->
  <div style="position:absolute;inset:24px;z-index:25;border:4px solid rgba(242,101,34,.60);pointer-events:none;"></div>

  <!-- ────────────────────────────────
       HEADER
  ──────────────────────────────── -->

  <!-- Logo -->
  <div style="position:absolute;top:72px;left:88px;display:flex;align-items:center;gap:12px;z-index:20;">
    <img src="../imagens/logo-icone.png" alt="" class="li">
    <div style="display:flex;flex-direction:column;gap:2px;">
      <div style="display:flex;align-items:baseline;line-height:1;">
        <span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#F26522;letter-spacing:-.3px;">LUMEN</span><span style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:27px;text-transform:uppercase;color:#FAFAFA;letter-spacing:-.3px;">GRID</span>
      </div>
      <span style="font-family:'DM Sans',sans-serif;font-weight:600;font-size:8px;text-transform:uppercase;letter-spacing:.3em;color:rgba(242,101,34,.90);">Energia Inteligente</span>
    </div>
  </div>

  <!-- Eyebrow -->
  <div style="position:absolute;top:163px;left:88px;z-index:20;">
    <p style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;letter-spacing:4px;text-transform:uppercase;color:rgba(242,101,34,.80);margin:0;">▶ tecnologia</p>
  </div>

  <!-- Headline + subtítulo -->
  <div style="position:absolute;top:210px;left:88px;right:88px;z-index:20;">
    <p style="font-family:'Space Grotesk',sans-serif;font-size:62px;font-weight:800;color:#FAFAFA;line-height:1.04;letter-spacing:-1.5px;margin:0 0 12px;">Microinversor ou<br>inversor string?</p>
    <p style="font-family:'DM Sans',sans-serif;font-size:18px;font-weight:300;color:rgba(250,250,250,.40);margin:0;">Entenda como cada tecnologia funciona.</p>
  </div>

  <!-- Divisor -->
  <div style="position:absolute;top:390px;left:88px;right:88px;height:1px;z-index:10;
    background:linear-gradient(to right,transparent,rgba(242,101,34,.28) 20%,rgba(242,101,34,.28) 80%,transparent);"></div>

  <!-- ────────────────────────────────
       IMAGEM DE COMPARAÇÃO CENTRAL
  ──────────────────────────────── -->
  <div style="position:absolute;top:408px;left:72px;right:72px;z-index:20;">
    <img src="imagens/micro vs string.png"
         style="width:100%;display:block;border-radius:4px;"
         alt="Microinversor vs Inversor String">
  </div>

  <!-- ────────────────────────────────
       RODAPÉ — CONCLUSÃO + CTA
  ──────────────────────────────── -->

  <!-- Divisor -->
  <div style="position:absolute;bottom:196px;left:88px;right:88px;height:1px;z-index:10;
    background:linear-gradient(to right,transparent,rgba(242,101,34,.25) 20%,rgba(242,101,34,.25) 80%,transparent);"></div>

  <div style="position:absolute;bottom:56px;left:88px;right:88px;z-index:20;">

    <p style="font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:#FAFAFA;margin:0 0 8px;letter-spacing:-.3px;">Qual é o melhor para o seu projeto?</p>
    <p style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;color:rgba(250,250,250,.38);line-height:1.55;margin:0 0 22px;max-width:740px;">A escolha depende do telhado, da incidência de sombras e das necessidades de cada imóvel.</p>

    <!-- CTA -->
    <div style="display:inline-flex;align-items:center;gap:12px;background:#F26522;padding:16px 32px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
      <span style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:#111;text-transform:uppercase;letter-spacing:2px;">Solicite uma análise</span>
    </div>

  </div>

</div>
</body>
</html>
